<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicación de Notas</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <main class="tarjeta">
        <img src="img/banner.png.jpg" alt="Banner ilustrativo de la aplicación de notas">
        <h1>Mis Notas</h1>
        <p class="ayuda">Crea y administra tus notas de forma rápida y segura.</p>
        
        <form id="formulario-nota" novalidate>
            <label for="titulo-nota">Título de la nota</label>
            <input id="titulo-nota" type="text" placeholder="Ej. Compras del día" required>

            <label for="contenido-nota">Contenido</label>
            <input id="contenido-nota" type="text" placeholder="Escribe tu nota aquí..." required>

            <p id="mensaje" class="mensaje" role="status"></p>

            <div class="acciones">
                <button type="submit" class="boton-principal">Guardar Nota</button>
                <button type="reset" class="boton-secundario">Limpiar</button>
            </div>
        </form>
    </main>
    <script src="app.js"></script>
</body>
</html>
